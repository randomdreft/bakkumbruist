<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Bakkum Bruist 2026 — Eikenhorst | Badge logo -->
  <defs>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2BB0C9"/>
      <stop offset="100%" stop-color="#0F6E84"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD86B"/>
      <stop offset="100%" stop-color="#FFB627"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <circle cx="240" cy="240" r="220"/>
    </clipPath>
  </defs>

  <!-- Sand background, clipped to circle -->
  <g clip-path="url(#badgeClip)">
    <rect x="0" y="0" width="480" height="480" fill="#F4E9D8"/>

    <!-- Sun -->
    <circle cx="240" cy="155" r="56" fill="url(#sunGrad)" opacity="0.75"/>

    <!-- Sea / wave (filled bottom) -->
    <path d="M -10 320 Q 60 290 130 320 T 270 320 T 410 320 T 510 320 L 510 490 L -10 490 Z"
          fill="url(#seaGrad)"/>
    <path d="M -10 345 Q 60 318 130 345 T 270 345 T 410 345 T 510 345"
          fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55"/>

    <!-- Bubbles rising -->
    <circle cx="100" cy="260" r="14" fill="none" stroke="#FF6B6B" stroke-width="3.5"/>
    <circle cx="100" cy="260" r="4" fill="#FF6B6B"/>
    <circle cx="380" cy="245" r="17" fill="none" stroke="#FF6B6B" stroke-width="3.5"/>
    <circle cx="380" cy="245" r="5" fill="#FF6B6B"/>
    <circle cx="78" cy="195" r="8" fill="#FF6B6B" opacity="0.85"/>
    <circle cx="408" cy="190" r="9" fill="#FF6B6B" opacity="0.85"/>
    <circle cx="55" cy="148" r="5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="430" cy="135" r="6" fill="#FF6B6B" opacity="0.7"/>

    <!-- Wordmark -->
    <text x="240" y="180" text-anchor="middle"
          font-family="'Trebuchet MS', 'Verdana', sans-serif"
          font-weight="900" font-size="56" fill="#0F4C5C"
          letter-spacing="2">BAKKUM</text>
    <text x="240" y="245" text-anchor="middle"
          font-family="'Trebuchet MS', 'Verdana', sans-serif"
          font-weight="900" font-size="56" fill="#0F4C5C"
          letter-spacing="2">BRUIST</text>

    <!-- Subtitle on wave -->
    <text x="240" y="408" text-anchor="middle"
          font-family="'Trebuchet MS', 'Verdana', sans-serif"
          font-weight="700" font-size="20" fill="#FFFFFF"
          letter-spacing="6">EIKENHORST</text>
    <text x="240" y="438" text-anchor="middle"
          font-family="'Trebuchet MS', 'Verdana', sans-serif"
          font-weight="700" font-size="18" fill="#FFD86B"
          letter-spacing="8">· 2026 ·</text>
  </g>

  <!-- Outer rings -->
  <circle cx="240" cy="240" r="220" fill="none" stroke="#0F4C5C" stroke-width="6"/>
  <circle cx="240" cy="240" r="208" fill="none" stroke="#0F4C5C" stroke-width="2"/>
</svg>
